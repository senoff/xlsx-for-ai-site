# build-validate — the MECHANICAL pre-merge gate for the static site.
#
# The site repo had zero CI, so xlsx-merge's merge-on-evidence door had nothing
# to read but a grace-clean claim (exactly what the door will not merge on). This
# is the graded pre-merge surface: it runs on the PR's own tree, needs no deploy,
# and fails the merge if the tree is structurally broken. The live GitHub-Pages
# DoD (dod-*.py / dod-page-walk.mjs) stays the post-deploy Done capstone; it does
# NOT gate merge.
#
# `synchronize` is in the trigger list on purpose. Once this check is REQUIRED, a
# required check that does not fire on the new head is ABSENT to branch protection
# and blocks merge forever with nothing red to click. It must run on every push.
name: build-validate

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  validate:
    name: HTML + links + sitemap
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The validator uses only Node built-ins — no `npm ci`, no browser download.
      - name: Prove the validator can still fail (self-test)
        run: node scripts/validate-site.mjs --selftest

      # The deploy-verify's LIVE sweep is a post-deploy capstone (deploy-verify-sitemap.yml),
      # not a merge gate — it must not couple the PR's green to live-prod health. But its
      # hermetic RED-arm proof IS graded here: it proves the completeness + 200-sweep arms
      # still bite (built-route dropped from the sitemap reds; a 404'd page reds), with no
      # network to prod. If this instrument cannot fail, its post-deploy green is worthless.
      - name: Prove the deploy-verify can still fail (self-test)
        run: node scripts/dod-deploy-verify-sitemap.mjs --selftest

      # Falsifiability, same posture as the two self-tests above: a stale-URL
      # detector that cannot redden is not a detector.
      - name: Prove the stale-sitemap-URL check can still fail (self-test)
        run: node scripts/dod-sitemap-no-stale-urls.mjs --selftest

      - name: Validate HTML structure + internal links + referenced assets
        run: node scripts/validate-site.mjs

      # gen-internal-links.mjs owns breadcrumb/children/related-siblings
      # injection for /tools/ + /importable/ (XLS-1616). It is idempotent
      # (marker-replace, write-only-on-change), so a clean tree regenerates to
      # itself; a diff here means a page was added/moved/renamed without
      # re-running the generator and committing the result.
      - name: Internal links (breadcrumbs + related + children) are current
        run: |
          node scripts/gen-internal-links.mjs
          git diff --exit-code -- tools/ importable/ \
            || { echo "::error::internal-link blocks are stale — run 'node scripts/gen-internal-links.mjs' and commit the result."; exit 1; }

      # gen-shopify-redirect-stubs.mjs owns the 124 tools/-tree meta-refresh
      # stubs that forward the 7 Shopify tool trees moved to /importable/
      # (XLS-1616 §2). Full-file regenerate, always-overwrite — a diff here
      # means /importable/'s content under those 7 trees moved without
      # reissuing the matching /tools/ stub.
      - name: Shopify redirect stubs are current
        run: |
          node scripts/gen-shopify-redirect-stubs.mjs
          git diff --exit-code -- tools/ \
            || { echo "::error::Shopify redirect stubs are stale — run 'node scripts/gen-shopify-redirect-stubs.mjs' and commit the result."; exit 1; }

      # gen-sitemap.mjs owns sitemap discovery + exclusion logic; regenerate and
      # assert the committed sitemap COVERS the same URLs, rather than re-walking
      # the tree here (a second implementation is a second answer that can drift).
      #
      # We compare <loc> URLs ONLY, not the whole file. <lastmod> is derived from
      # each page's git commit date (`git log -1 --format=%cs`), which is empty on
      # a shallow CI checkout for unchanged files (-> today) and shifts on every
      # squash-merge — a full-file `git diff` would false-red on both. URL coverage
      # is the real contract ("a new page must be registered in the sitemap") and
      # is path-derived, so it is stable regardless of checkout depth or dates.
      - name: Sitemap covers every page
        run: |
          git show HEAD:sitemap.xml | grep -oE '<loc>[^<]*</loc>' | sort > /tmp/committed-locs
          node scripts/gen-sitemap.mjs
          grep -oE '<loc>[^<]*</loc>' sitemap.xml | sort > /tmp/fresh-locs
          if ! diff -u /tmp/committed-locs /tmp/fresh-locs; then
            echo "::error::sitemap.xml URL coverage is stale — run 'node scripts/gen-sitemap.mjs' and commit the result."
            exit 1
          fi

      # The reverse of the check above: every committed sitemap.xml <loc> must
      # have a matching page on disk (XLS-1616 §3). Catches a hand-edited or
      # never-regenerated sitemap.xml row pointing at a URL that only
      # 301s/404s live — the completeness check above cannot see this
      # direction (it only proves disk ⊆ sitemap, not sitemap ⊆ disk).
      - name: Sitemap has no stale (disk-orphaned) URLs
        run: node scripts/dod-sitemap-no-stale-urls.mjs
